<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slidebrary</title>
    <link rel="stylesheet" href="taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="app-header">
        <button class="icon-button profile-button" type="button" aria-label="Открыть профиль">
          <img src="assets/ui/user.svg" alt="" />
        </button>
        <h1>Slidebrary</h1>
        <button class="window-menu" type="button" aria-label="Меню приложения">
          <img src="assets/ui/more.svg" alt="" />
        </button>
      </header>

      <div class="workspace">
        <aside class="sidebar" aria-label="Разделы библиотеки">
          <button class="collapse-button" type="button" aria-label="Свернуть меню">›</button>
          <nav id="sectionNav" class="section-nav"></nav>
        </aside>

        <main class="main-panel">
          <div class="tabs" role="tablist" aria-label="Источник материалов">
            <button
              class="tab is-active"
              type="button"
              role="tab"
              data-tab="public"
              aria-selected="true"
            >
              Публичное
            </button>
            <button class="tab" type="button" role="tab" data-tab="personal" aria-selected="false">
              Личное
            </button>
          </div>

          <div class="search-row">
            <label class="search-field" for="searchInput">
              <img src="assets/ui/search.svg" alt="" />
              <input id="searchInput" type="search" placeholder="Поиск" autocomplete="off" />
            </label>
            <button
              id="filterButton"
              class="icon-button filter-button"
              type="button"
              aria-label="Открыть фильтры"
            >
              <img src="assets/ui/filter.svg" alt="" />
              <span id="filterBadge" class="filter-badge" hidden></span>
            </button>
          </div>

          <div class="content-toolbar">
            <p id="sectionHint">Выберите макет для вашего слайда</p>
            <div class="toolbar-actions">
              <button
                id="sortButton"
                class="icon-button"
                type="button"
                aria-label="Изменить сортировку"
                title="Сортировка"
              >
                <img src="assets/ui/sort.svg" alt="" />
              </button>
              <button
                id="viewButton"
                class="icon-button"
                type="button"
                aria-label="Переключить вид"
                title="Плитка или список"
              >
                <img src="assets/ui/list.svg" alt="" />
              </button>
            </div>
          </div>

          <div id="statusRegion" class="status-region" role="status" aria-live="polite"></div>
          <div id="library" class="library-grid" aria-label="Материалы библиотеки"></div>

          <div class="selection-actions">
            <button id="clearSelectionButton" class="button button-secondary" type="button">
              Отменить
            </button>
            <button id="insertSelectionButton" class="button button-primary" type="button" disabled>
              Добавить
            </button>
          </div>
        </main>
      </div>
    </div>

    <div id="filterOverlay" class="overlay" hidden>
      <section class="filter-drawer" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
        <header class="drawer-header">
          <button id="resetFiltersButton" class="text-button" type="button">Очистить</button>
          <h2 id="filterTitle">Фильтры</h2>
          <button
            id="closeFiltersButton"
            class="icon-button"
            type="button"
            aria-label="Закрыть фильтры"
          >
            <img src="assets/ui/close.svg" alt="" />
          </button>
        </header>
        <form id="filterForm" class="filter-form">
          <label>
            <span>По типу контента</span>
            <select name="type">
              <option value="">Любой</option>
            </select>
          </label>
          <label>
            <span>По продуктам</span>
            <select name="product">
              <option value="">Любой</option>
            </select>
          </label>
          <label>
            <span>По формату</span>
            <select name="format">
              <option value="">Любой</option>
            </select>
          </label>
          <label>
            <span>По стилю оформления</span>
            <select name="style">
              <option value="">Любой</option>
            </select>
          </label>
          <button class="button button-primary filter-submit" type="submit">
            Показать результаты
          </button>
        </form>
      </section>
    </div>

    <div id="previewOverlay" class="overlay preview-overlay" hidden>
      <section
        class="preview-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="previewTitle"
      >
        <header class="drawer-header">
          <span></span>
          <h2 id="previewDialogTitle">Подробнее</h2>
          <button
            id="closePreviewButton"
            class="icon-button"
            type="button"
            aria-label="Закрыть предпросмотр"
          >
            <img src="assets/ui/close.svg" alt="" />
          </button>
        </header>
        <img id="previewImage" class="preview-image" src="data:," alt="" />
        <h3 id="previewTitle"></h3>
        <dl class="preview-details">
          <div>
            <dt>Статус</dt>
            <dd>Утверждено</dd>
          </div>
          <div>
            <dt>Формат</dt>
            <dd id="previewFormat"></dd>
          </div>
          <div>
            <dt>Продукт</dt>
            <dd id="previewProduct"></dd>
          </div>
        </dl>
        <button id="previewInsertButton" class="button button-primary preview-insert" type="button">
          Вставить слайд
        </button>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="taskpane.js"></script>
  </body>
</html>
