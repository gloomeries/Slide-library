<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slidebrary</title>
    <link rel="stylesheet" href="taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="app-header">
        <button
          id="profileButton"
          class="icon-button profile-button"
          type="button"
          aria-label="Открыть личный кабинет"
        >
          <img src="assets/ui/user.svg" alt="" />
        </button>
        <h1>Slidebrary</h1>
      </header>

      <div class="workspace">
        <aside class="sidebar" aria-label="Разделы библиотеки">
          <button
            id="collapseButton"
            class="collapse-button"
            type="button"
            aria-label="Свернуть меню"
          >
            <img
              id="collapseIcon"
              class="collapse-icon"
              src="assets/ui/icon.svg"
              alt=""
              aria-hidden="true"
            />
            <span>Свернуть</span>
          </button>
          <nav id="sectionNav" class="section-nav"></nav>
        </aside>

        <main class="main-panel">
          <div class="tabs" role="tablist" aria-label="Источник материалов">
            <button
              class="tab is-active"
              type="button"
              role="tab"
              data-tab="public"
              aria-selected="true"
            >
              Публичное
            </button>
            <button class="tab" type="button" role="tab" data-tab="personal" aria-selected="false">
              Личное
            </button>
          </div>

          <div id="libraryView" class="library-view">
            <div class="search-row">
              <label class="search-field" for="searchInput">
                <img src="assets/ui/search.svg" alt="" />
                <input id="searchInput" type="search" placeholder="Поиск" autocomplete="off" />
              </label>
              <button
                id="filterButton"
                class="icon-button filter-button"
                type="button"
                aria-label="Открыть фильтры"
              >
                <img src="assets/ui/filter.svg" alt="" />
                <span id="filterBadge" class="filter-badge" hidden></span>
              </button>
            </div>

            <div class="content-toolbar">
              <p id="sectionHint">Выберите макет для вашего слайда</p>
              <div class="toolbar-actions">
                <button
                  id="sortButton"
                  class="icon-button"
                  type="button"
                  aria-label="Изменить сортировку"
                  title="Сортировка"
                >
                  <img src="assets/ui/сортировка.svg" alt="" />
                </button>
                <button
                  id="viewButton"
                  class="icon-button"
                  type="button"
                  aria-label="Переключить вид"
                  title="Плитка или список"
                >
                  <img src="assets/ui/показ.svg" alt="" />
                </button>
                <button
                  id="shareButton"
                  class="icon-button"
                  type="button"
                  aria-label="Поделиться материалами"
                  title="Поделиться"
                >
                  <img src="assets/ui/пошарить.svg" alt="" />
                </button>
              </div>
            </div>

            <div id="statusRegion" class="status-region" role="status" aria-live="polite"></div>
            <div id="library" class="library-grid" aria-label="Материалы библиотеки"></div>

            <div class="selection-actions">
              <button id="clearSelectionButton" class="button button-secondary" type="button">
                Отменить
              </button>
              <button
                id="insertSelectionButton"
                class="button button-primary"
                type="button"
                disabled
              >
                Добавить
              </button>
            </div>
          </div>

          <section
            id="templateView"
            class="template-view"
            aria-labelledby="templateViewTitle"
            hidden
          >
            <h2 id="templateViewTitle">Предложить свой файл в базу</h2>
            <form id="templateForm" class="template-form">
              <button id="templateDropzone" class="template-dropzone" type="button">
                <img
                  class="upload-icon"
                  src="assets/ui/cloud_arrow_up_outline_28.svg"
                  alt=""
                  aria-hidden="true"
                />
                <span class="upload-copy">
                  <strong id="templateFileLabel">Загрузить файл</strong>
                  <span>Поддерживаемые форматы: pptx, jpg и png</span>
                  <span>Вес: до 20 Мб.</span>
                </span>
              </button>
              <input
                id="templateFileInput"
                class="visually-hidden"
                name="file"
                type="file"
                accept=".ppt,.pptx,.jpg,.jpeg,.png"
                tabindex="-1"
              />

              <label class="template-name-field">
                <span class="visually-hidden">Название шаблона</span>
                <input
                  id="templateNameInput"
                  name="title"
                  type="text"
                  placeholder="Добавьте название шаблона"
                  autocomplete="off"
                  required
                />
              </label>

              <div class="template-metadata-grid">
                <label>
                  <span>Тип контента</span>
                  <select name="type">
                    <option value="Презентация">Презентация</option>
                    <option value="Фотография">Фотография</option>
                    <option value="Иллюстрация">Иллюстрация</option>
                  </select>
                </label>
                <label>
                  <span>Продукт</span>
                  <select name="product">
                    <option value="Общее">Общее</option>
                    <option value="Сферум">Сферум</option>
                    <option value="MAX">MAX</option>
                    <option value="VK">VK</option>
                  </select>
                </label>
                <label>
                  <span>Цель</span>
                  <select name="goal">
                    <option value="">Любая</option>
                    <option value="Информировать">Информировать</option>
                    <option value="Обучить">Обучить</option>
                    <option value="Продать">Продать</option>
                    <option value="Отчитаться">Отчитаться</option>
                  </select>
                </label>
                <label>
                  <span>Формат</span>
                  <select name="format">
                    <option value="16×9">16x9</option>
                    <option value="4×3">4x3</option>
                    <option value="1×1">1x1</option>
                    <option value="9×16">9x16</option>
                  </select>
                </label>
                <label>
                  <span>Структура</span>
                  <select name="structure">
                    <option value="">Любая</option>
                    <option value="Титульный слайд">Титульный слайд</option>
                    <option value="Аналитический слайд">Аналитический слайд</option>
                    <option value="Схема">Схема</option>
                    <option value="План">План</option>
                  </select>
                </label>
                <label>
                  <span>Тип выступления</span>
                  <select name="presentationType">
                    <option value="Отчетный">Отчетный</option>
                    <option value="Обучающий">Обучающий</option>
                    <option value="Продающий">Продающий</option>
                    <option value="Информационный">Информационный</option>
                  </select>
                </label>
                <label>
                  <span>Визуал</span>
                  <select name="visual">
                    <option value="">Не определен</option>
                    <option value="Инфографика">Инфографика</option>
                    <option value="Диаграмма">Диаграмма</option>
                    <option value="Фотография">Фотография</option>
                    <option value="Текст">Текст</option>
                  </select>
                </label>
                <label>
                  <span>Стиль оформления</span>
                  <select name="style">
                    <option value="Светлая тема">Светлая тема</option>
                    <option value="Темная тема">Темная тема</option>
                  </select>
                </label>
              </div>

              <div class="template-tags-field">
                <div class="template-tags-label">
                  <span>Хештеги</span>
                  <span id="templateTagCounter">0 / 25</span>
                </div>
                <div id="templateTagsEditor" class="template-tags-editor">
                  <div id="templateTags" class="template-tags"></div>
                  <input
                    id="templateTagInput"
                    type="text"
                    placeholder="Новый хештег"
                    autocomplete="off"
                  />
                </div>
              </div>

              <label class="template-ai-checkbox">
                <input name="aiGenerated" type="checkbox" />
                <span>ИИ-генерация</span>
              </label>

              <div class="template-actions">
                <button id="cancelTemplateButton" class="button button-secondary" type="button">
                  Отменить
                </button>
                <button
                  id="submitTemplateButton"
                  class="button button-primary"
                  type="submit"
                  disabled
                >
                  Добавить
                </button>
              </div>
            </form>
          </section>

          <section
            id="assistantView"
            class="assistant-view"
            aria-labelledby="assistantViewTitle"
            hidden
          >
            <h2 id="assistantViewTitle">Создать презентацию по теме</h2>
            <form id="assistantForm" class="assistant-form">
              <label class="assistant-topic-field" for="assistantPrompt">
                <span class="assistant-field-heading">
                  <span>Опишите тему</span>
                  <span id="assistantPromptCounter">0 / 2000</span>
                </span>
                <textarea
                  id="assistantPrompt"
                  name="prompt"
                  maxlength="2000"
                  rows="1"
                  placeholder="Добавьте запрос здесь..."
                ></textarea>
              </label>

              <div class="assistant-settings">
                <label class="assistant-field">
                  <span>Количество слайдов</span>
                  <select name="slideCount">
                    <option value="4">4</option>
                    <option value="6">6</option>
                    <option value="8">8</option>
                    <option value="10">10</option>
                    <option value="12">12</option>
                  </select>
                </label>

                <label class="assistant-field">
                  <span>Язык презентации</span>
                  <select name="language">
                    <option value="ru">Русский</option>
                    <option value="en">Английский</option>
                  </select>
                </label>

                <label class="assistant-field">
                  <span>Содержание</span>
                  <select name="detailLevel">
                    <option value="detailed">Подробно</option>
                    <option value="brief">Кратко</option>
                  </select>
                </label>

                <label class="assistant-field">
                  <span>Источник изображений</span>
                  <span class="assistant-select-with-icon">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                      <rect x="3.5" y="4" width="14" height="15" rx="2" />
                      <circle cx="8" cy="9" r="1.5" />
                      <path d="m5.5 16 3.5-3.5 2.5 2.5 2-2 2 2" />
                      <path d="M19 13v6m-3-3h6" />
                    </svg>
                    <select name="imageSource">
                      <option value="ai">Изображения ИИ</option>
                      <option value="library">Библиотека изображений</option>
                      <option value="none">Без изображений</option>
                    </select>
                  </span>
                </label>
              </div>

              <label class="assistant-switch-row">
                <span>Расширенный ИИ</span>
                <span class="assistant-switch-control">
                  <span
                    class="assistant-help"
                    title="Использовать расширенную модель для более детальной презентации"
                    aria-hidden="true"
                    >?</span
                  >
                  <input name="advancedAi" type="checkbox" checked />
                  <span class="assistant-switch" aria-hidden="true"></span>
                </span>
              </label>

              <div class="assistant-actions">
                <button id="cancelAssistantButton" class="button button-secondary" type="button">
                  Отменить
                </button>
                <button
                  id="startAssistantButton"
                  class="button button-primary"
                  type="submit"
                  disabled
                >
                  Начать
                </button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>

    <div id="accountOverlay" class="account-overlay" hidden>
      <div class="account-shell">
        <p class="account-brand">personal office</p>
        <section
          class="account-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="accountTitle"
        >
          <h2 id="accountTitle">Личный кабинет</h2>
          <form id="accountForm" class="account-form">
            <label class="account-field">
              <span>Почта</span>
              <input
                id="accountEmail"
                name="email"
                type="email"
                placeholder="name@company.ru"
                autocomplete="email"
                required
              />
            </label>

            <div class="account-field">
              <span>Выберите папку на диске с личными шаблонами</span>
              <button id="folderPickerButton" class="folder-picker" type="button">
                <span class="folder-path">//… Выбрать…</span>
              </button>
              <input
                id="folderInput"
                class="visually-hidden"
                type="file"
                webkitdirectory
                directory
                multiple
                tabindex="-1"
                aria-hidden="true"
              />
            </div>

            <label class="account-field">
              <span>Последний вход</span>
              <input id="lastLoginField" type="text" value="Ещё не выполнялся" readonly />
            </label>

            <label class="account-field">
              <span>Файл индексации данных. Обновлен:</span>
              <input id="indexUpdatedField" type="text" value="Файл не выбран" readonly />
            </label>

            <div class="account-actions">
              <button id="cancelAccountButton" class="button button-secondary" type="button">
                Отменить
              </button>
              <button class="button button-primary" type="submit">Сохранить</button>
            </div>
          </form>
        </section>
      </div>
    </div>

    <div id="filterOverlay" class="filter-overlay" hidden>
      <div class="filter-page">
        <p class="filter-brand">filtres Modal Page</p>
        <section class="filter-modal" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
          <header class="filter-header">
            <button id="resetFiltersButton" class="text-button" type="button">Очистить</button>
            <h2 id="filterTitle">Фильтры</h2>
            <button
              id="closeFiltersButton"
              class="filter-close"
              type="button"
              aria-label="Закрыть фильтры"
            >
              ×
            </button>
          </header>
          <form id="filterForm" class="filter-form">
            <label>
              <span>По типу контента</span>
              <select name="type">
                <option value="">Любой</option>
              </select>
            </label>
            <label>
              <span>По продуктам</span>
              <select name="product">
                <option value="">Любой</option>
              </select>
            </label>
            <label>
              <span>По цели</span>
              <select name="goal">
                <option value="">Любая</option>
                <option value="Информировать">Информировать</option>
                <option value="Обучить">Обучить</option>
                <option value="Продать">Продать</option>
                <option value="Отчитаться">Отчитаться</option>
              </select>
            </label>
            <label>
              <span>По формату</span>
              <select name="format">
                <option value="">Любой</option>
              </select>
            </label>
            <label>
              <span>По структуре</span>
              <select name="structure">
                <option value="">Любая</option>
                <option value="Титульный слайд">Титульный слайд</option>
                <option value="Аналитический слайд">Аналитический слайд</option>
                <option value="Схема">Схема</option>
                <option value="План">План</option>
              </select>
            </label>
            <label>
              <span>По типу выступления</span>
              <select name="presentationType">
                <option value="">Любой</option>
                <option value="Отчетный">Отчетный</option>
                <option value="Обучающий">Обучающий</option>
                <option value="Продающий">Продающий</option>
                <option value="Информационный">Информационный</option>
              </select>
            </label>
            <label>
              <span>По визуалу</span>
              <select name="visual">
                <option value="">Любой</option>
                <option value="Инфографика">Инфографика</option>
                <option value="Диаграмма">Диаграмма</option>
                <option value="Фотография">Фотография</option>
                <option value="Текст">Текст</option>
              </select>
            </label>
            <label>
              <span>По стилю оформления</span>
              <select name="style">
                <option value="">Любой</option>
              </select>
            </label>
            <label>
              <span>По хештегам</span>
              <select name="hashtags">
                <option value="">Любые</option>
                <option value="аналитика">Аналитика, исследование, данные</option>
                <option value="маркетинг">Маркетинг, аудитория, кампания</option>
                <option value="продукт">Продукт, прототип, roadmap</option>
                <option value="бизнес">Бизнес, процесс, команда</option>
              </select>
            </label>
            <label class="filter-checkbox">
              <input name="aiGenerated" type="checkbox" />
              <span>ИИ-генерации</span>
            </label>
            <button class="button button-primary filter-submit" type="submit">
              Показать результаты
            </button>
          </form>
        </section>
      </div>
    </div>

    <div id="previewOverlay" class="overlay preview-overlay" hidden>
      <section
        class="preview-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="previewDialogTitle"
      >
        <header class="preview-header">
          <span></span>
          <h2 id="previewDialogTitle">Подробнее</h2>
          <button
            id="closePreviewButton"
            class="preview-close"
            type="button"
            aria-label="Закрыть предпросмотр"
          >
            <span aria-hidden="true"></span>
          </button>
        </header>
        <div class="preview-content">
          <img id="previewImage" class="preview-image" src="data:," alt="" />
          <div class="preview-pagination" aria-label="Слайд 2 из 7">
            <span></span>
            <span class="is-active"></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <dl class="preview-details">
            <div>
              <dt>Статус</dt>
              <dd>Утверждено</dd>
            </div>
            <div>
              <dt>Версия</dt>
              <dd>v.1</dd>
            </div>
            <div>
              <dt>Владелец</dt>
              <dd>В. Шевченко</dd>
            </div>
          </dl>
          <button
            id="previewInsertButton"
            class="button button-primary preview-insert"
            type="button"
          >
            Вставить слайд
          </button>
        </div>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="taskpane.js"></script>
  </body>
</html>
